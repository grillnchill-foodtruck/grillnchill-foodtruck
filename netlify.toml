# ============================================================
#  Grilln Chill – Netlify Konfiguration
# ============================================================

[build]
  # Statische Dateien im Root-Verzeichnis
  publish    = "."
  # Speisekarte als HTML in index.html, türkische Seite tr/index.html
  command    = "node werkzeug/seiten-bauen.js"
  # Hier liegen die Netlify-Functions
  functions  = "netlify/functions"

# Saubere URL für SumUp-Endpoint:
[[redirects]]
  from   = "/sumup-checkout"
  to     = "/.netlify/functions/sumup-checkout"
  status = 200

# Apple-Wallet: Pass-Download (Knopf im Konto) + Aktualisierungs-Dienst,
# den iOS selbst aufruft (Registrierung, Pass-Abruf, Log)
[[redirects]]
  from   = "/wallet-pass"
  to     = "/.netlify/functions/wallet-pass"
  status = 200
[[redirects]]
  from   = "/wallet-api/*"
  to     = "/.netlify/functions/wallet-api/:splat"
  status = 200

# Saubere URL für E-Mail-Endpoint:
[[redirects]]
  from   = "/send-email"
  to     = "/.netlify/functions/send-email"
  status = 200

# Status-Update (vom Owner per E-Mail-Klick):
[[redirects]]
  from   = "/status-update"
  to     = "/.netlify/functions/status-update"
  status = 200

# Laden-Status (Pause / Ausverkauft) – lesen + schreiben:
[[redirects]]
  from   = "/shop-status"
  to     = "/.netlify/functions/shop-status"
  status = 200

[[redirects]]
  from   = "/google-reviews"
  to     = "/.netlify/functions/google-reviews"
  status = 200

# Admin-Panel unter sauberer URL /admin erreichbar:
[[redirects]]
  from   = "/admin"
  to     = "/admin.html"
  status = 200

# Live-Cockpit fuer Kubi (iPad/Tablet, gleiche Anmeldung wie das Admin-Tool)
[[redirects]]
  from   = "/cockpit"
  to     = "/cockpit.html"
  status = 200

# Dienstplan (Personalplanung, gleiche Anmeldung wie das Admin-Tool)
[[redirects]]
  from   = "/dienstplan"
  to     = "/dienstplan.html"
  status = 200

# Sicherheits-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Content-Security-Policy: entsteht beim Build in _headers, mit den
    # Hashes der Inline-Skripte (werkzeug/seiten-bauen.js, Abschnitt 4)
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    # payment=(self): Apple Pay und Google Pay im SumUp-Widget laufen auf
    # unserer eigenen Seite (Paket bezahlen). Vorher payment=().
    Permissions-Policy     = "geolocation=(self), microphone=(), camera=(self), payment=(self), usb=()"

# Cache-Optimierung für statische Dateien
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Service Worker: NICHT cachen + Scope auf Root erlauben
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control       = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest: korrekter Content-Type, moderat cachen
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# App-Icons: lange cachen (ändern sich selten)
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from   = "/track"
  to     = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from   = "/push-subscribe"
  to     = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from   = "/push-send"
  to     = "/.netlify/functions/push-send"
  status = 200

# Retargeting: täglicher Gutschein-Versand (09:00 UTC = 11:00 dt. Sommerzeit)
[functions."retarget-daily"]
  schedule = "0 9 * * *"

# Geburtstags-Bonus: täglich morgens prüfen (07:00 UTC ≈ 09:00 dt. Sommerzeit)
[functions."birthday-daily"]
  schedule = "0 7 * * *"

# Stehende Bestellungen: Erinnerung am Vorabend (17:00 UTC ≈ 19:00 dt. Sommerzeit).
# Verschickt nur an Kunden, die die Erinnerung ausdrücklich eingeschaltet haben.
# Das Logo wird für den Rechnungskopf im PDF gebraucht.
# speisekarte.js braucht lib/preisberechnung.js, um den belasteten Betrag aus
# dem Warenkorb nachzurechnen. Der Bundler zieht sie über das require() ohnehin
# mit – der Eintrag hier ist die Rückversicherung, damit eine Umstellung des
# Bundlers die Preisprüfung nicht stillschweigend abschaltet.
[functions]
  # Die .pem-Dateien braucht die Apple-Wallet-Signatur - der Bundler packt
  # von sich aus nur JavaScript ein.
  included_files = ["logo.png", "speisekarte.js",
                    "netlify/functions/lib/apple-pass-cert.pem",
                    "netlify/functions/lib/apple-wwdr-g4.pem"]

[functions."standing-remind"]
  schedule = "0 17 * * *"

# Datensicherung: wöchentlich, montags 03:15 UTC. Bewusst nachts und an einem
# Tag, an dem der Truck steht – das Auslesen aller Speicher erzeugt kurz Last.
# Aufbewahrt werden die letzten 8 Stände, siehe backup-weekly.js.
[functions."backup-weekly"]
  schedule = "15 3 * * 1"

[[redirects]]
  from   = "/voucher-check"
  to     = "/.netlify/functions/voucher-check"
  status = 200

[[redirects]]
  from   = "/retarget-optout"
  to     = "/.netlify/functions/retarget-optout"
  status = 200

# Wallet-Karten: nach einer Änderung der Kartenfelder alle gespeicherten Karten
# einmal auffrischen (PASS_STAND in wallet-auffrischen.js). Danach nur ein kurzer
# Blick auf den Merker alle 10 Minuten.
[functions."wallet-auffrischen"]
  schedule = "*/10 * * * *"

# Google-Bewertungen: jeden Morgen frisch holen (04:20 UTC), statt auf den
# ersten Besucher nach Ablauf der 24 h zu warten. Meldet per Telegram, wenn
# Google den Abruf verweigert (höchstens einmal pro Woche).
[functions."google-reviews-daily"]
  schedule = "20 4 * * *"

# Zahlungs-Abgleich: Sicherheitsnetz hinter dem Realtime-Webhook (alle 5 Min.)
[functions."orders-reconcile"]
  schedule = "*/5 * * * *"

[[redirects]]
  from   = "/catering"
  to     = "/catering.html"
  status = 200

[[redirects]]
  from   = "/team"
  to     = "/?team=start"
  status = 302

[[redirects]]
  from   = "/gutscheine"
  to     = "/gutscheine.html"
  status = 200

# Schriften: selbst gehostet, ändern sich nie → 1 Jahr, immutable
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Store-Badges (App Store / Google Play): ändern sich nie
[[headers]]
  for = "/badges/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Produktbilder: 7 Tage Browser-Cache (SW hält sie zusätzlich frisch)
[[headers]]
  for = "/produktbilder/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Hero-Assets (Poster + Video): ändern sich praktisch nie, 1 Woche cachen
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Team-Foto & Halal-Siegel: statische Bilder im Root
[[headers]]
  for = "/team.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/hcg-siegel.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from   = "/account"
  to     = "/.netlify/functions/account"
  status = 200

[[redirects]]
  from   = "/s/*"
  to     = "/status.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control   = "no-store"

[[headers]]
  for = "/cockpit.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control   = "no-store"

[[headers]]
  for = "/dienstplan.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control   = "no-store"

# Türkische Seite /tr/ (entsteht beim Build): Bilder, Skripte und Sprachpakete,
# die JavaScript relativ nachlädt, liegen im Hauptverzeichnis. Ohne force, also
# gilt die Regel nur, wo unter /tr/ keine Datei liegt (tr/index.html bleibt).
[[redirects]]
  from   = "/tr/*"
  to     = "/:splat"
  status = 200

# --- Paket lieferung ---
# Fahrer-Ansicht für Kubis Handy (fahrer.html, gleiche Anmeldung wie das Admin-Tool).
[[redirects]]
  from   = "/fahrer"
  to     = "/fahrer.html"
  status = 200

[[headers]]
  for = "/fahrer.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control   = "no-store"

# --- Paket firmen ---
# Firmen-Mittag: öffentliche Seite und Verwaltung.
[[redirects]]
  from   = "/firmen"
  to     = "/firmen.html"
  status = 200

[[redirects]]
  from   = "/firmen-admin"
  to     = "/firmen-admin.html"
  status = 200

[[headers]]
  for = "/firmen-admin.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control   = "no-store"

# --- Paket cockpit ---
# Wochenbericht per Telegram: montags 07:00 UTC (08:00 Winterzeit, 09:00
# Sommerzeit) für die Woche davor. Je Woche höchstens ein geplanter Bericht,
# siehe netlify/functions/wochenbericht.js.
[functions."wochenbericht"]
  schedule = "0 7 * * 1"

# --- Paket bezahlen ---
# Burger-Pass: Kauf im Kundenkonto, Prüfung nach der Rückkehr von SumUp,
# Verkaufsliste im Admin-Tool
[[redirects]]
  from   = "/burger-pass"
  to     = "/.netlify/functions/burger-pass"
  status = 200

# Burger-Pass: täglich Ablauf und Erinnerungsmails (08:30 UTC = 9:30/10:30 Uhr)
[functions."burger-pass-erinnerung"]
  schedule = "30 8 * * *"

# Apple Pay im SumUp-Widget: Apple prüft die Domain über diese Datei. Sie
# kommt aus dem SumUp-Dashboard (Einstellungen > Für Entwickler > Payment
# wallets) und liegt dann unter .well-known/ ohne Dateiendung.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# --- Paket schutz ---
# Einmalige Korrektur der Gutschein-Kundenzähler nach dem Zählfehler vom
# 29.10.2026 (zaehler-korrektur.js). Der erste Lauf nach dem Deploy korrigiert
# und setzt den Merker migration:zaehler-2026-11, danach liest jeder Lauf nur
# noch den Merker. Kann nach erfolgreichem Lauf wieder entfernt werden.
[functions."zaehler-korrektur"]
  schedule = "23 * * * *"

# --- Paket catering ---
# Catering-Angebote: Kundenseite /angebot (Link mit ID und Token aus der Mail).
# Hinweis fürs Zusammenführen: Netlify nimmt die erste passende Regel. Diese
# Regeln müssen VOR der 404-Regel "/*" stehen, sonst greift die zuerst.
[[redirects]]
  from   = "/angebot"
  to     = "/angebot.html"
  status = 200

[[headers]]
  for = "/angebot.html"
  [headers.values]
    X-Robots-Tag    = "noindex, nofollow"
    Cache-Control   = "no-store"
    Referrer-Policy = "no-referrer"

# Täglich 08:00 UTC: Erinnerung nach 3 Tagen, Ablauf, offene Anzahlungen
[functions."catering-angebot-taeglich"]
  schedule = "0 8 * * *"

# Das Angebots-PDF braucht das Logo: logo.png steht schon im globalen
# included_files unter [functions], eine eigene Liste je Function würde die
# globale ersetzen.

# Gebrandete 404-Seite. Muss der LETZTE Redirect bleiben: Regeln gelten in
# Reihenfolge, neue Redirects also immer davor eintragen.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
