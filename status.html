  .wrap{max-width:440px;margin:0 auto;padding:0 1.1rem 3rem;}
  header{padding:1.2rem 0 1rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;}

  .kopf-links{display:flex;align-items:center;gap:.55rem;min-width:0;}
  .zurueck{display:inline-flex;align-items:center;gap:.15rem;min-height:44px;padding:0 .7rem 0 .45rem;border-radius:999px;border:1px solid #2E2820;background:#17140F;color:#F5E9D0;text-decoration:none;font-size:.85rem;font-weight:700;white-space:nowrap;}

  .zurueck:active{transform:scale(.97);}
  .native-tabbar .wrap{padding-bottom:110px;}
  .refpill{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;color:#C9BCA4;background:#17140F;border:1px solid #2E2820;border-radius:999px;padding:.35rem .7rem;white-space:nowrap;}
  .card{background:#14110D;border:1px solid #2E2820;border-radius:16px;padding:1.1rem 1.15rem;margin-bottom:.9rem;}
  .eta{display:flex;align-items:center;gap:.8rem;}
  .eta .big{font-size:1.35rem;font-weight:700;}
  .eta .lbl{font-size:.72rem;color:#8F8471;}
  .tl{position:relative;padding-left:28px;}
  .tl .line{position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#2E2820;border-radius:2px;}
  .tl .fill{position:absolute;left:7px;top:8px;width:2px;background:linear-gradient(180deg,#CC4715,#FF7A3D);border-radius:2px;transition:height 450ms cubic-bezier(0.16,1,0.3,1);}
  .step{position:relative;padding-bottom:1.15rem;}
  .step:last-child{padding-bottom:0;}
  .dot{position:absolute;left:-28px;top:2px;width:16px;height:16px;border-radius:50%;background:#14110D;border:2px solid #3a342b;}
  .step.done .dot{background:#E85A24;border-color:#E85A24;}
  .step.done .dot::after{content:'';position:absolute;left:4px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);}
  .step.now .dot{background:#E85A24;border-color:#E85A24;box-shadow:0 0 0 5px rgba(232,90,36,0.22);animation:pulse 1.6s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 3px rgba(232,90,36,0.30)}70%{box-shadow:0 0 0 9px rgba(232,90,36,0)}100%{box-shadow:0 0 0 3px rgba(232,90,36,0)}}
  .step .t{font-size:.9rem;font-weight:700;color:#6b6357;}
  .step.done .t{color:#F5E9D0;}
  .step.now .t{color:#FF7A3D;}
  .step .s{font-size:.72rem;color:#8F8471;margin-top:.1rem;}
  .pushcard{display:flex;align-items:center;gap:.7rem;border-color:#E85A24;}
  .pushcard p{flex:1;font-size:.8rem;color:#C9BCA4;line-height:1.45;}
  .btn{background:#CC4715;color:#fff;border:none;font:inherit;font-weight:700;font-size:.8rem;padding:.55rem 1rem;border-radius:999px;cursor:pointer;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .items div{display:flex;justify-content:space-between;gap:.8rem;font-size:.82rem;color:#C9BCA4;padding:.22rem 0;}
  .items div span:last-child{color:#F5E9D0;white-space:nowrap;}
  .items .sum{border-top:1px solid #2E2820;margin-top:.4rem;padding-top:.5rem;font-weight:700;color:#F5E9D0;}
  .actions{display:flex;gap:.6rem;}
  .actions a{flex:1;text-align:center;border:1px solid #3a342b;color:#C9BCA4;font-size:.8rem;text-decoration:none;padding:.65rem 0;border-radius:12px;}
  .actions a:hover{border-color:#E85A24;color:#F5E9D0;}
  .empty{color:#8F8471;text-align:center;padding:3rem 1rem;font-size:.9rem;line-height:1.6;}
  footer{color:#5f584c;font-size:.68rem;text-align:center;margin-top:1.4rem;}
  @media (prefers-reduced-motion: reduce){ .step.now .dot{animation:none} .tl .fill{transition:none} }

  /* ============ DESIGN PASS v2 · ui-ux-pro-max ============ */
  .btn{transition:transform .2s cubic-bezier(0.34,1.56,0.64,1),box-shadow .2s cubic-bezier(0.16,1,0.3,1),filter .2s ease;will-change:transform}

  a:focus-visible,button:focus-visible,.btn:focus-visible,[tabindex]:focus-visible{outline:3px solid #FF7A3D;outline-offset:3px;border-radius:10px}

  /* ============ WARTEN: Busy-Knopf, Skelett, Aktualisieren ohne Neuaufbau ============ */
  @keyframes gncSpin { to { transform: rotate(360deg); } }
  @keyframes gncBreath { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  .is-busy { position: relative; cursor: progress !important; color: transparent !important; opacity: 1 !important; }
  .is-busy > :not(.busy-spin) { visibility: hidden; }
  .busy-spin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid var(--busy-ink, currentColor); border-right-color: transparent; opacity: 0; animation: gncSpin .8s linear infinite; transition: opacity 150ms cubic-bezier(0.16, 1, 0.3, 1); }
  .is-busy.busy-shown .busy-spin { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .busy-spin { animation: gncBreath 1.2s ease-in-out infinite; border-right-color: var(--busy-ink, currentColor); } }
  /* Skelett beim ersten Laden, in Endgroesse */
  .skel { background: rgba(255,255,255,.06); border-radius: 8px; }
  @media (prefers-reduced-motion: no-preference) { .skel { background: linear-gradient(90deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.05) 100%); background-size: 260% 100%; animation: shimmer 1.4s linear infinite; } }
  @keyframes shimmer { from { background-position: 130% 0; } to { background-position: -130% 0; } }
  .skel-row{display:flex;align-items:center;gap:10px;margin-bottom:1.15rem;}
  .skel-row:last-child{margin-bottom:0;}
  .skel-dot{flex:none;width:18px;height:18px;border-radius:50%;}
  .skel-bar{width:60%;height:14px;}
  .skel-card{height:120px;border-radius:16px;margin-bottom:.9rem;}
  .visually-hidden{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  /* Verbindungshinweis: leer ohne Hoehe, bleibt aber als Live-Region im Baum */
  .conn{margin:0 0 .9rem;padding:.6rem .85rem;font-size:.8rem;line-height:1.45;color:#C9BCA4;background:#17140F;border:1px solid #2E2820;border-radius:12px;text-align:center;}
  .conn:empty{margin:0;padding:0;border:0;}

  .pushcard{flex-wrap:wrap;row-gap:0;}

  .pushcard .pushnote{flex:0 0 100%;font-size:.74rem;color:#FF7A3D;}

  /* Neuer Schritt: Punkt kurz anheben */

    .dot,.dot.lift{transform:none;transition:none}
    .btn{transform:none !important}

  .fbcard textarea:focus{outline:none;border-color:#E85A24;}
  .fb-count{font-size:.7rem;color:#8F8471;text-align:right;margin:.3rem 0 .6rem;font-variant-numeric:tabular-nums;}
  .fb-msg{font-size:.78rem;color:#FF7A3D;margin:0 0 .6rem;}
  .fb-msg:empty{display:none;}
  .fbcard .btn{min-height:44px;padding:.65rem 1.2rem;font-size:.85rem;}
  .fb-thanks{font-size:.9rem;color:#F5E9D0;line-height:1.5;margin:0 0 .8rem;}
  .pill-link{display:inline-flex;align-items:center;gap:.45rem;min-height:44px;padding:.5rem 1rem;border:1px solid #3a342b;border-radius:999px;color:#F5E9D0;text-decoration:none;font-size:.82rem;font-weight:700;}
  .pill-link svg{width:16px;height:16px;flex:none;}
  .pill-link:hover{border-color:#E85A24;color:#F5E9D0;}
  @media (prefers-reduced-motion: reduce){ .star svg{transition:none;transform:none !important;} }
  /* ============ LIVE-LIEFERUNG: Karte mit Kubis Punkt (status-live.js, karte.js) ============ */
  .livecard{border-color:#E85A24;}
  .lk-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;margin-bottom:.8rem;}
  .livecard .lbl{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C9BCA4;}
  .livecard .big{font-size:1.35rem;font-weight:700;line-height:1.25;margin-top:.2rem;}
  .lk-badge{display:inline-flex;align-items:center;gap:.4rem;flex:none;font-size:.72rem;font-weight:700;color:#8FD46A;border:1px solid rgba(109,190,69,.5);border-radius:999px;padding:.25rem .65rem;white-space:nowrap;}
  .lk-dot{width:8px;height:8px;border-radius:50%;background:#6DBE45;animation:lkPuls 1.8s ease-out infinite;}
  @keyframes lkPuls{0%{box-shadow:0 0 0 0 rgba(109,190,69,.55)}70%{box-shadow:0 0 0 7px rgba(109,190,69,0)}100%{box-shadow:0 0 0 0 rgba(109,190,69,0)}}
  .lk-karte{height:230px;}
  .lk-info{font-size:.78rem;line-height:1.45;color:#C9BCA4;margin-top:.65rem;}
  .lk-karte[hidden] + .lk-info{margin-top:0;}
  @media (prefers-reduced-motion: reduce){ .lk-dot{animation:none} }
</style>

/* ---- Warten sichtbar machen (Busy-Knopf) ---- */
function gncBusy(btn, on) {
  if (!btn) return;
  if (on) {
    if (btn.classList.contains('is-busy')) return;
    btn.style.setProperty('--busy-ink', getComputedStyle(btn).color);
    btn._busyWasDisabled = !!btn.disabled;
    btn.disabled = true;
    btn.classList.add('is-busy');
    btn.setAttribute('aria-busy', 'true');
    var sp = document.createElement('span');
    sp.className = 'busy-spin'; sp.setAttribute('aria-hidden', 'true');
    btn.appendChild(sp);
    btn._busyShownAt = 0;
    btn._busyT = setTimeout(function () { btn.classList.add('busy-shown'); btn._busyShownAt = Date.now(); }, 150);
    return;
  }
  if (!btn.classList.contains('is-busy')) return;
  clearTimeout(btn._busyT);
  var rest = btn._busyShownAt ? Math.max(0, 400 - (Date.now() - btn._busyShownAt)) : 0;
  setTimeout(function () {
    btn.classList.remove('is-busy', 'busy-shown');
    btn.removeAttribute('aria-busy');
    btn.style.removeProperty('--busy-ink');
    var sp = btn.querySelector(':scope > .busy-spin'); if (sp) sp.remove();
    btn.disabled = !!btn._busyWasDisabled;
  }, rest);
}
function gncIsBusy(btn) { return !!(btn && btn.classList.contains('is-busy')); }
async function withBusy(btn, fn) {
  if (!btn) return fn();
  if (gncIsBusy(btn)) return;           // zweiter Tipp waehrend des Wartens: ignorieren
  gncBusy(btn, true);
  try { return await fn(); } finally { gncBusy(btn, false); }
}


function euro(x) { return (typeof x === 'number') ? x.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }) : ''; }
function hhmm(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleTimeString(LANG === 'tr' ? 'tr-TR' : (LANG === 'en' ? 'en-GB' : 'de-DE'), { hour: '2-digit', minute: '2-digit' }) + T.clock; } catch (e) { return ''; }
}

/* ---- Zeichnen: einmal komplett, danach nur geaenderte Teile ---- */
function stepsFor() { return T.steps[DATA.mode] || T.steps.pickup; }
function stepIndex(steps) {
  var idx = 0;
  for (var i = 0; i < steps.length; i++) { if (steps[i].id === DATA.state) idx = i; }
  return idx;
}
function stepCls(j, idx, isFinal) { return j < idx ? 'done' : (j === idx ? (isFinal ? 'done' : 'now') : ''); }
function stepSub(st, j, idx, isFinal) {
  var time = DATA.times && DATA.times[st.id] ? hhmm(DATA.times[st.id]) : '';
  if (time) return time;
  if (j === idx && !isFinal && st.s) return st.s;
  return '';
}
function fillPctFor(steps, idx) { return steps.length > 1 ? Math.round(idx / (steps.length - 1) * 100) : 0; }

function pushHtml(isFinal) {
  if (isFinal) return '';
  if (PUSH_STATE === 'on') return '<div class="card pushcard"><p>' + T.pushOn + '</p></div>';
  if (!('serviceWorker' in navigator && 'PushManager' in window)) return '';
  return '<div class="card pushcard"><p id="pushTxt" aria-live="polite">' + T.push + '</p>'
    + '<button class="btn" id="pushBtn" type="button">' + T.enable + '</button>'
    + '<p class="pushnote" id="pushNote" aria-live="polite"></p></div>';
}
/* "Bin da": nur bei Abholung, solange die Bestellung laeuft. Meldet Kubi per
   Team-Mitteilung, dass der Gast am Truck steht (wie die App am Truck). */
function arriveHtml(isFinal) {
  if (isFinal || DATA.mode !== 'pickup') return '';
  if (DATA.arrivedAt) return '<div class="card pushcard arrivecard"><p>' + T.arrived + '</p></div>';
  return '<div class="card pushcard arrivecard"><p id="arrTxt" aria-live="polite">' + T.arrive + '</p>'
    + '<button class="btn" id="arrBtn" type="button">' + T.arriveBtn + '</button></div>';
}
function bindArrive() {
  var b = document.getElementById('arrBtn');
  if (b) b.addEventListener('click', function () {
    withBusy(b, function () {
      return fetch('/.netlify/functions/order-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'arrived', reference: REF, k: KEY }),
      }).then(function (r) { return r.ok; }).catch(function () { return false; });
    }).then(function (ok) {
      if (!ok) { setConn(true); return; }
      DATA.arrivedAt = new Date().toISOString();
      var t = document.getElementById('arrTxt');
      if (t) t.textContent = T.arrived;
      b.remove();
    });
  });
}
function bindPush() {
  var pb = document.getElementById('pushBtn');
  if (pb) pb.addEventListener('click', enablePush);
}

/* ---- Abholnummer des Tages (lib/abholnummer.js) ---- */
function nrHtml() {
  if (!DATA || !DATA.abholnr) return '';
  return '<div class="card nrcard"><div><div class="lbl">' + T.nrLabel + '</div>'
    + (DATA.mode === 'pickup' ? '<div class="hint">' + T.nrHint + '</div>' : '')
    + '</div><div class="nr">' + T.nr + Number(DATA.abholnr) + '</div></div>';
}

/* ---- Feedback nach Abschluss (feedback.js) ----
   Texte in 8 Sprachen aus i18n.js und den Sprachpaketen. Die Seite selbst
   kennt nur de/en/tr; die Pakete werden erst geladen, wenn die Karte
   gebraucht wird, und mit absolutem Pfad (unter /s/ zeigen relative Pfade
   auf diese Seite). Rückfall Deutsch, gleich wie in i18n.js. */
var GOOGLE_BEWERTEN = 'https://search.google.com/local/writereview?placeid=ChIJJ9h4Tk09ukcRAAFxrgGWsSc';
var FB_DE = {
  'fb.title': 'Wie war\'s?', 'fb.lead': 'Tipp auf die Sterne. Ein Satz dazu hilft Kubi am meisten.',
  'fb.stars_label': 'Bewertung in Sternen', 'fb.star_1': '1 Stern', 'fb.star_n': '{n} Sterne',
  'fb.text_label': 'Was sollen wir wissen? (freiwillig)', 'fb.placeholder': 'Was hat geschmeckt, was nicht?',
  'fb.chars': '{n} von 500 Zeichen', 'fb.send': 'Feedback senden', 'fb.pick': 'Wähl zuerst die Sterne.',
  'fb.thanks': 'Danke. Kubi liest jede Rückmeldung selbst.', 'fb.done': 'Du hast diese Bestellung schon bewertet. Danke.',
  'fb.google': 'Auch bei Google bewerten', 'fb.error': 'Das hat nicht geklappt. Versuch es gleich noch einmal.'
};
var FB_SPRACHEN = ['de', 'en', 'tr', 'it', 'es', 'pt', 'fr', 'nl'];
var FB_LANG = (function () {
  try { var sv = localStorage.getItem('gnc_lang'); if (FB_SPRACHEN.indexOf(sv) !== -1) return sv; } catch (e) {}
  var nv = (navigator.language || 'de').toLowerCase();
  for (var i = 1; i < FB_SPRACHEN.length; i++) { if (nv.indexOf(FB_SPRACHEN[i]) === 0) return FB_SPRACHEN[i]; }
  return 'de';
})();
var FB = { sterne: 0, geladen: false, laedt: null };
function fbT(key) {
  var d = window.I18N || null;
  try { if (d && d[FB_LANG] && d[FB_LANG][key]) return d[FB_LANG][key]; } catch (e) {}
  try { if (d && d.de && d.de[key]) return d.de[key]; } catch (e) {}
  return FB_DE[key] || key;
}
function fbSkript(src) {
  return new Promise(function (ok) {
    var sc = document.createElement('script');
    sc.src = src;
    sc.addEventListener('load', function () { ok(true); });
    sc.addEventListener('error', function () { ok(false); });
    document.head.appendChild(sc);
  });
}
function fbTexteLaden() {
  if (FB.laedt) return FB.laedt;
  var bis = new Promise(function (ok) { setTimeout(ok, 4000); });   // nie ewig warten: dann eben Deutsch
  var laden = (typeof I18N !== 'undefined' ? Promise.resolve(true) : fbSkript('/i18n.js')).then(function (da) {
    if (!da || FB_LANG === 'de' || typeof LANG_PACKS === 'undefined' || !LANG_PACKS[FB_LANG]) return;
    if (window.I18N && window.I18N[FB_LANG]) return;
    return fbSkript('/' + LANG_PACKS[FB_LANG]);
  }).then(function () {
    // i18n.js legt I18N mit const an; fuer fbT() am window bereitstellen
    try { if (typeof I18N !== 'undefined') window.I18N = I18N; } catch (e) {}
  });
  FB.laedt = Promise.race([laden, bis]);
  return FB.laedt;
}
var STERN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6-5.38-2.83-5.38 2.83 1.03-6L3.3 9.6l6-.9z"/></svg>';
var EXT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M19 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4.5"/></svg>';
function fbEsc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
// Link-Ziel als fertiges Attribut, damit kein Platzhalter-href im HTML steht (Crawler, Jury R4)
function hrefAttr(u) { return 'href="' + fbEsc(u) + '"'; }
function fbStart() {
  fbTexteLaden().then(fbZeichnen);
}
function fbGoogleHtml() {
  return '<a class="pill-link" ' + hrefAttr(GOOGLE_BEWERTEN) + ' target="_blank" rel="noopener">' + fbEsc(fbT('fb.google')) + EXT_SVG + '</a>';
}
function fbFertig(text) {
  var c = document.getElementById('fbCard');
  if (!c) return;
  c.innerHTML = '<h2>' + fbEsc(fbT('fb.title')) + '</h2><p class="fb-thanks" role="status">' + fbEsc(text) + '</p>' + fbGoogleHtml();
}
function fbZeichnen() {
  var c = document.getElementById('fbCard');
  if (!c) return;
  c.setAttribute('lang', FB_LANG);
  c.removeAttribute('aria-busy');
  if (DATA && DATA.feedback) { fbFertig(fbT('fb.done')); return; }
  var sterne = '';
  for (var i = 1; i <= 5; i++) {
    var lbl = i === 1 ? fbT('fb.star_1') : fbT('fb.star_n').replace('{n}', i);
    sterne += '<button type="button" class="star' + (i <= FB.sterne ? ' on' : '') + '" role="radio" data-stern="' + i + '" aria-checked="' + (i === FB.sterne ? 'true' : 'false') + '"'
      + ' tabindex="' + ((FB.sterne ? i === FB.sterne : i === 1) ? '0' : '-1') + '" aria-label="' + fbEsc(lbl) + '">' + STERN_SVG + '</button>';
  }
  c.innerHTML = '<h2 id="fbTitel">' + fbEsc(fbT('fb.title')) + '</h2>'
    + '<p class="fb-lead">' + fbEsc(fbT('fb.lead')) + '</p>'
    + '<div class="stars" role="radiogroup" aria-describedby="fbMsg" aria-label="' + fbEsc(fbT('fb.stars_label')) + '">' + sterne + '</div>'
    + '<label for="fbText">' + fbEsc(fbT('fb.text_label')) + '</label>'
    + '<textarea id="fbText" maxlength="500" rows="3" placeholder="' + fbEsc(fbT('fb.placeholder')) + '" aria-describedby="fbCount"></textarea>'
    + '<div class="fb-count" id="fbCount">' + fbEsc(fbT('fb.chars').replace('{n}', '0')) + '</div>'
    + '<p class="fb-msg" id="fbMsg" role="status" aria-live="polite"></p>'
    + '<button type="button" class="btn" id="fbSend">' + fbEsc(fbT('fb.send')) + '</button>';
  var gruppe = c.querySelector('.stars');
  gruppe.addEventListener('click', function (e) {
    var b = e.target.closest('.star');
    if (b) fbWaehle(Number(b.getAttribute('data-stern')), false);
  });
  gruppe.addEventListener('keydown', function (e) {
    var w = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (e.key === 'Home') w = -5;
    if (e.key === 'End') w = 5;
    if (!w) return;
    e.preventDefault();
    fbWaehle(Math.max(1, Math.min(5, (FB.sterne || 0) + w)), true);
  });
  var ta = document.getElementById('fbText');
  ta.addEventListener('input', function () {
    document.getElementById('fbCount').textContent = fbT('fb.chars').replace('{n}', ta.value.length);
  });
  document.getElementById('fbSend').addEventListener('click', fbSenden);
}
function fbWaehle(n, fokus) {
  FB.sterne = n;
  var alle = document.querySelectorAll('#fbCard .star');
  for (var i = 0; i < alle.length; i++) {
    var s = i + 1;
    alle[i].classList.toggle('on', s <= n);
    alle[i].setAttribute('aria-checked', s === n ? 'true' : 'false');
    alle[i].setAttribute('tabindex', s === n ? '0' : '-1');
  }
  if (fokus && alle[n - 1]) alle[n - 1].focus();
  var m = document.getElementById('fbMsg');
  if (m) m.textContent = '';
}
function fbSenden() {
  var btn = document.getElementById('fbSend');
  var msg = document.getElementById('fbMsg');
  if (!FB.sterne) {
    msg.textContent = fbT('fb.pick');
    var erster = document.querySelector('#fbCard .star');
    if (erster) erster.focus();
    return;
  }
  var text = (document.getElementById('fbText').value || '').slice(0, 500);
  withBusy(btn, function () {
    return fetch('/.netlify/functions/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'senden', reference: REF, k: KEY, stars: FB.sterne, text: text, lang: FB_LANG }),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { s: r.status, d: d }; });
    }).catch(function () { return { s: 0, d: {} }; });
  }).then(function (a) {
    if (!a) return;
    if (a.s === 200) { DATA.feedback = { stars: FB.sterne }; fbFertig(fbT('fb.thanks')); return; }
    if (a.s === 409 && a.d && a.d.error === 'schon_bewertet') { DATA.feedback = { stars: 0 }; fbFertig(fbT('fb.done')); return; }
    if (msg) msg.textContent = fbT('fb.error');
  });
}

function renderNotFound() {
  var el = document.getElementById('app');
  el.innerHTML = '<p class="empty">' + T.notfound + '</p>';
  el.setAttribute('aria-busy', 'false');
  SHOWN = null;
}

function renderFull() {
  var el = document.getElementById('app');
  var steps = stepsFor();
  var idx = stepIndex(steps);
  var isFinal = idx === steps.length - 1;
  var fillPct = fillPctFor(steps, idx);

  var html = nrHtml();
  if (DATA.isPreorder && DATA.scheduledFor) {
    html += '<div class="card eta"><div><div class="lbl">' + (DATA.mode === 'delivery' ? T.planDelivery : T.planPickup) + '</div><div class="big">' + DATA.scheduledFor.replace(/</g, '&lt;') + '</div></div></div>';
  }
  html += '<div class="card" id="tlCard"><div class="tl"><span class="line"></span><span class="fill" style="height:' + fillPct + '%"></span>';
  for (var j = 0; j < steps.length; j++) {
    var st = steps[j];
    var sub = stepSub(st, j, idx, isFinal);
    html += '<div class="step ' + stepCls(j, idx, isFinal) + '"><span class="dot"></span><div class="t">' + st.t + '</div>';
    if (sub) html += '<div class="s">' + sub + '</div>';
    html += '</div>';
  }
  html += '</div></div>';

  html += arriveHtml(isFinal);
  html += pushHtml(isFinal);
  html += isFinal && DATA.completed ? '<div class="card fbcard" id="fbCard" aria-busy="true"></div>' : '';

  if (DATA.items && DATA.items.length) {
    html += '<div class="card items">';
    for (var m = 0; m < DATA.items.length; m++) {
      var it = DATA.items[m];
      html += '<div><span>' + (it.qty || 1) + '× ' + String(it.name).replace(/</g, '&lt;') + '</span><span>' + euro((it.price || 0) * (it.qty || 1)) + '</span></div>';
    }
    if (typeof DATA.total === 'number') html += '<div class="sum"><span>' + T.total + '</span><span>' + euro(DATA.total) + '</span></div>';
    html += '</div>';
  }

  html += '<div class="actions">'
    + '<a href="tel:+4915118540604">' + T.call + '</a>'
    + '<a href="https://maps.google.com/maps?cid=2860232172322750720" target="_blank" rel="noopener">' + T.truck + '</a>'
    + '</div>';
  el.innerHTML = html;
  el.setAttribute('aria-busy', 'false');
  bindPush();
  bindArrive();
  if (document.getElementById('fbCard')) fbStart();
  SHOWN = { mode: DATA.mode, state: DATA.state, nr: DATA.abholnr || null };
}

// Polling: nur Schritte, Balken, Zeiten und Push-Karte anfassen, damit Fokus und Puls bleiben
function updateSteps() {
  var el = document.getElementById('app');
  var steps = stepsFor();
  var nodes = el.querySelectorAll('.tl .step');
  if (nodes.length !== steps.length) { renderFull(); return; }
  var idx = stepIndex(steps);
  var isFinal = idx === steps.length - 1;
  for (var j = 0; j < steps.length; j++) {
    var node = nodes[j];
    var cls = stepCls(j, idx, isFinal);
    node.className = 'step' + (cls ? ' ' + cls : '');
    var sub = stepSub(steps[j], j, idx, isFinal);
    var s = node.querySelector('.s');
    if (sub) {
      if (!s) { s = document.createElement('div'); s.className = 's'; node.appendChild(s); }
      s.textContent = sub;
    } else if (s) { s.remove(); }
  }
  var fill = el.querySelector('.tl .fill');
  if (fill) fill.style.height = fillPctFor(steps, idx) + '%';
  var dot = nodes[idx].querySelector('.dot');
  if (dot) { dot.classList.add('lift'); void dot.offsetWidth; dot.classList.remove('lift'); }

  var ac = el.querySelector('.arrivecard');
  if (isFinal && ac) ac.remove();
  if (isFinal && DATA.completed && !document.getElementById('fbCard')) {
    var tc0 = document.getElementById('tlCard');
    if (tc0) { tc0.insertAdjacentHTML('afterend', '<div class="card fbcard" id="fbCard" aria-busy="true"></div>'); fbStart(); }
  }
  var pc = el.querySelector('.pushcard:not(.arrivecard)');
  if (isFinal && pc) { pc.remove(); }
  else if (!isFinal && !pc) {
    var ph = pushHtml(false), tc = document.getElementById('tlCard');
    if (ph && tc) { tc.insertAdjacentHTML('afterend', ph); bindPush(); }
  }

  document.getElementById('stLive').textContent = steps[idx].t;
  SHOWN.state = DATA.state;
}

function paint() {
  document.getElementById('refPill').textContent = '#' + DATA.reference;
  if (!SHOWN || SHOWN.mode !== DATA.mode || (SHOWN.nr || null) !== (DATA.abholnr || null)) renderFull();
  else if (SHOWN.state !== DATA.state) updateSteps();
  if (window.gncLiveSync) window.gncLiveSync(DATA);   // Live-Karte bei Lieferung unterwegs
}

function setConn(off) {
  if (off === CONN_OFF) return;
  CONN_OFF = off;
  document.getElementById('connMsg').textContent = off ? T.offline : '';
}

function urlBase64ToUint8Array(base64String) {
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64), arr = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

function enablePush() {
  var btn = document.getElementById('pushBtn');
  var note = document.getElementById('pushNote');
  if (note) note.textContent = '';
  withBusy(btn, function () {
    return navigator.serviceWorker.register('/sw.js').then(function (reg) {
      return fetch('/.netlify/functions/push-subscribe').then(function (r) { return r.json(); }).then(function (kd) {
        if (!kd.publicKey) throw new Error('no key');
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(kd.publicKey) });
      });
    }).then(function (sub) {
      return fetch('/.netlify/functions/order-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'subscribe', reference: REF, k: KEY, subscription: sub, lang: LANG }),
      });
    }).then(function (r) {
      PUSH_STATE = r.ok ? 'on' : 'idle';
    }).catch(function () { PUSH_STATE = 'idle'; });
  }).then(function () {
    if (PUSH_STATE === 'on') {
      // Karte in place umstellen: Text tauschen (Live-Region), Knopf und Hinweis entfernen
      var pb = document.getElementById('pushBtn'), pn = document.getElementById('pushNote'), pt = document.getElementById('pushTxt');
      if (pb) pb.remove();
      if (pn) pn.remove();
      if (pt) pt.textContent = T.pushOn;
    } else if (typeof Notification !== 'undefined' && Notification.permission === 'denied') {
      var n = document.getElementById('pushNote');
      if (n) n.textContent = T.pushBlocked;
    }
  });
}

function load() {
  if (!REF || !KEY) { DATA = null; renderNotFound(); return; }
  fetch('/.netlify/functions/order-status?ref=' + encodeURIComponent(REF) + '&k=' + encodeURIComponent(KEY))
    .then(function (r) {
      if (r.ok) return r.json();
      // 4xx (unbekannt, Link ungueltig): wie bisher "nicht gefunden"; 408, 429 und 5xx gelten als voruebergehend
      if (r.status >= 400 && r.status < 500 && r.status !== 408 && r.status !== 429) return null;
      throw new Error('HTTP ' + r.status);
    })
    .then(function (d) {
      setConn(false);
      if (d) { DATA = d; paint(); }
      else if (!DATA) renderNotFound(); // beim Polling: zuletzt geladene Daten behalten statt "nicht gefunden"
    }, function () {
      setConn(true); // Netzwerk oder Server: Hinweis zeigen, Polling laeuft weiter
    });
}

(function initStatic() {
  var lt = document.getElementById('loadingTxt'); if (lt) lt.textContent = T.loading;
  var ft = document.getElementById('footTxt'); if (ft) ft.textContent = T.auto;
  document.title = LANG === 'en' ? "Order status - Grill'n Chill" : (LANG === 'tr' ? "Sipariş durumu - Grill'n Chill" : "Bestellstatus - Grill'n Chill");
})();
load();
setInterval(load, 20000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
</script>
