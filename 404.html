<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – Grill'n Chill</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<meta name="theme-color" content="#0A0A0A">
<style>
  @font-face{font-family:'Bowlby One';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/bowlby-one-latin-400-normal.woff2')format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/inter-latin-400-normal.woff2')format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/inter-latin-700-normal.woff2')format('woff2')}
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;background:#0C0B09;color:#F5E9D0;
    font-family:'Inter',-apple-system,sans-serif;text-align:center;padding:2rem;
    background-image:radial-gradient(circle at 50% 120%, rgba(232,90,36,0.14), transparent 55%);}
  .code{font-family:'Bowlby One',cursive;font-size:clamp(4.5rem,20vw,8rem);line-height:1;
    color:#E85A24;text-shadow:0 0 60px rgba(232,90,36,0.35);letter-spacing:0.04em;}
  h1{font-family:'Bowlby One',cursive;font-weight:400;font-size:clamp(1.1rem,4vw,1.5rem);margin:0.8rem 0 0.6rem;}
  p{color:#C9BCA4;max-width:42ch;margin:0 auto 1.8rem;line-height:1.6;font-size:0.95rem;}
  .row{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;}
  a.btn{display:inline-block;padding:0.9rem 1.7rem;border-radius:12px;text-decoration:none;font-weight:700;font-size:0.95rem;}
  a.primary{background:#CC4715;color:#fff;}
  a.ghost{border:1px solid #2E2820;color:#C9BCA4;}
  a.ghost:hover{border-color:#E85A24;color:#F5E9D0;}

  /* ============ DESIGN PASS v2 · ui-ux-pro-max ============ */
  a.btn{transition:transform .22s cubic-bezier(0.34,1.56,0.64,1),box-shadow .22s cubic-bezier(0.16,1,0.3,1),border-color .22s ease,color .22s ease;will-change:transform}
  a.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(232,90,36,.42)}
  a.ghost:hover{transform:translateY(-2px)}
  a.btn:active{transform:scale(.97)}
  a:focus-visible{outline:3px solid #FF7A3D;outline-offset:3px;border-radius:10px}
  @media(prefers-reduced-motion:no-preference){
    .code{animation:d404 .7s cubic-bezier(0.16,1,0.3,1) both}
    h1{animation:d404 .7s cubic-bezier(0.16,1,0.3,1) .08s both}
    p{animation:d404 .7s cubic-bezier(0.16,1,0.3,1) .16s both}
    .row{animation:d404 .7s cubic-bezier(0.16,1,0.3,1) .24s both}
    @keyframes d404{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Diese Seite ist durchgebrannt</h1>
    <p>Den Link gibt es nicht (mehr) – aber saftige Halal-Burger gibt es zum Glück immer. Zurück zum Wesentlichen?</p>
    <div class="row">
      <a class="btn primary" href="/#menu">Zur Speisekarte</a>
      <a class="btn ghost" href="/">Zur Startseite</a>
    </div>
  </main>
</body>
</html>
